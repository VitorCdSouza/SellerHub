<main class="pagina">
  <section class="cartao" aria-labelledby="titulo-login">
    <p class="marca">
      <img
        ngSrc="/logo-sellerhub.png"
        width="36"
        height="34"
        class="logo"
        alt=""
        aria-hidden="true"
        priority
      />
      SellerHub
    </p>
    <h1 id="titulo-login" appFocoPagina>Entre na sua conta</h1>

    <form [formGroup]="formulario" (ngSubmit)="entrar()" [attr.aria-busy]="enviando()" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input
          id="email"
          #campoEmail
          class="campo-texto"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          maxlength="254"
          required
          [attr.aria-invalid]="
            submetido() && formulario.controls.email.invalid
          "
          [attr.aria-describedby]="
            submetido() && formulario.controls.email.invalid
              ? 'erro-email'
              : null
          "
        />
        @if (submetido() && formulario.controls.email.invalid) {
          <p id="erro-email" class="erro-campo">Informe um e-mail válido.</p>
        }
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input
            id="senha"
            #campoSenha
            class="campo-texto"
            [type]="senhaVisivel() ? 'text' : 'password'"
            formControlName="senha"
            autocomplete="current-password"
            required
            [attr.aria-invalid]="
              submetido() && formulario.controls.senha.invalid
            "
            [attr.aria-describedby]="
              submetido() && formulario.controls.senha.invalid
                ? 'erro-senha'
                : null
            "
          />
          <button
            type="button"
            class="mostrar-senha"
            aria-label="Mostrar senha"
            aria-controls="senha"
            [attr.aria-pressed]="senhaVisivel()"
            (click)="senhaVisivel.set(!senhaVisivel())"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @if (senhaVisivel()) {
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c4.97 0 8.07 3.5 9.94 6.65a1 1 0 0 1 0 .7 13.5 13.5 0 0 1-1.67 2.68M14.08 14.16a3 3 0 0 1-4.17-4.17M17.48 17.5A10.75 10.75 0 0 1 2.06 12.35a1 1 0 0 1 0-.7 13.43 13.43 0 0 1 4.45-5.15M2 2l20 20"
                />
              } @else {
                <path
                  d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0"
                />
              }
            </svg>
          </button>
        </div>
        @if (submetido() && formulario.controls.senha.invalid) {
          <p id="erro-senha" class="erro-campo">Informe sua senha.</p>
        }
      </div>

      <button type="submit" class="entrar" [disabled]="enviando()">
        {{ enviando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div role="alert" aria-atomic="true">
      @if (erro()) {
        <p class="mensagem erro">{{ erro() }}</p>
      }
    </div>
    <div role="status" aria-atomic="true">
      @if (sucesso()) {
        <p class="mensagem sucesso">{{ sucesso() }}</p>
      }
    </div>
  </section>
</main>
