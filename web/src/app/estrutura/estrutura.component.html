<a class="pular-conteudo" href="#conteudo-principal">Ir para o conteúdo</a>
<div class="estrutura">
  <aside class="lateral" aria-label="Área de trabalho">
    <a routerLink="/produtos" class="marca" aria-label="SellerHub — produtos">
      <img
        ngSrc="/logo-sellerhub.png"
        width="32"
        height="30"
        class="logo"
        alt=""
        aria-hidden="true"
        priority
      />
      SellerHub
    </a>
    <nav aria-label="Menu principal">
      @for (modulo of modulos; track modulo.nome) {
        @if (modulo.rota) {
          <a [routerLink]="modulo.rota" routerLinkActive="ativo" ariaCurrentWhenActive="page">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="modulo.icone" />
            </svg>
            {{ modulo.nome }}
          </a>
        } @else {
          <span class="modulo-pendente">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="modulo.icone" />
            </svg>
            {{ modulo.nome }}
            <span class="em-breve">Em breve</span>
          </span>
        }
      }
    </nav>
    <div class="conta">
      <span class="avatar" aria-hidden="true">{{ iniciais() }}</span>
      <span class="email">{{ auth.usuario()?.email }}</span>
      <button type="button" class="botao-saida" (click)="sair()" [disabled]="saindo()">
        {{ saindo() ? 'Saindo...' : 'Sair' }}
      </button>
    </div>
  </aside>
  <div class="area-principal">
    <div role="alert" aria-atomic="true">
      @if (erroSaida()) {
        <p class="erro-saida">{{ erroSaida() }}</p>
      }
    </div>
    <main id="conteudo-principal" tabindex="-1"><router-outlet /></main>
  </div>
</div>
