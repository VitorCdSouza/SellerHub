<dialog
  #dialogo
  class="dialogo"
  aria-labelledby="titulo-exclusao"
  aria-describedby="descricao-exclusao"
  (cancel)="impedirFechamentoDuranteEnvio($event)"
  (close)="fechado.emit()"
>
  <h2 id="titulo-exclusao">Excluir produto</h2>

  <div class="conteudo-dialogo">
    <p id="descricao-exclusao">
      Excluir {{ produto().nome }} (SKU {{ produto().sku }})? Essa ação não pode ser desfeita.
    </p>

    @if (erro()) {
      <p class="mensagem-erro" role="alert">{{ erro() }}</p>
    }
  </div>

  <div class="acoes-dialogo">
    <button type="button" class="botao-secundario" [disabled]="enviando()" (click)="fechar()">
      Cancelar
    </button>
    <button type="button" class="botao-perigo" [disabled]="enviando()" (click)="excluir()">
      {{ enviando() ? 'Excluindo...' : 'Excluir produto' }}
    </button>
  </div>
</dialog>
