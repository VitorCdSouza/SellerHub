<section aria-labelledby="titulo-cadastro">
  <header class="cabecalho-pagina">
    <div>
      <a routerLink="/produtos" class="link-voltar">Produtos</a>
      <h1 id="titulo-cadastro" appFocoPagina>Novo produto</h1>
    </div>

    <div class="acoes-pagina">
      <button type="button" class="botao-secundario" [disabled]="enviando()" (click)="cancelar()">
        Cancelar
      </button>
      <button type="submit" form="formulario-produto" class="botao-primario" [disabled]="enviando()">
        {{ enviando() ? 'Salvando...' : 'Salvar produto' }}
      </button>
    </div>
  </header>

  <div class="cartao formulario">
    <app-produto-formulario
      [enviando]="enviando()"
      [erroEnvio]="erro()"
      (salvar)="salvar($event)"
    />
  </div>
</section>
