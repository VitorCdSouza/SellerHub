<dialog
  #dialogo
  class="dialogo"
  aria-labelledby="titulo-cadastro"
  (cancel)="impedirFechamentoDuranteEnvio($event)"
  (close)="fechado.emit()"
>
  <h2 id="titulo-cadastro">Novo produto</h2>

  <app-produto-formulario
    [enviando]="enviando()"
    [erroEnvio]="erro()"
    (salvar)="salvar($event)"
  />

  <div class="acoes-dialogo">
    <button type="button" class="botao-secundario" [disabled]="enviando()" (click)="fechar()">
      Cancelar
    </button>
    <button type="submit" form="formulario-produto" class="botao-primario" [disabled]="enviando()">
      {{ enviando() ? 'Salvando...' : 'Salvar produto' }}
    </button>
  </div>
</dialog>
